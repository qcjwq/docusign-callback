    <script type="text/javascript">
        var SUCCESS_LOGIN_REDIRECT = "index.php";
        // If this page was opened with ?next=/..., send the user back there after login.
        // Need to cover both paths login.js takes:
        //   1. server returns "<file>.php" → login.js does window.location = res
        //   2. server returns "true"       → login.js does window.location = SUCCESS_LOGIN_REDIRECT
        // Override both by pointing SUCCESS_LOGIN_REDIRECT at next, and hooking ajaxSuccess
        // to overwrite window.location right after login.js sets it.
        (function() {
            var m = window.location.search.match(/[?&]next=([^&]+)/);
            if (!m) return;
            var next = decodeURIComponent(m[1]);
            if (next.charAt(0) !== '/' || next.indexOf('//') === 0) return;

            SUCCESS_LOGIN_REDIRECT = next;

            $(document).ready(function() {
                $(document).ajaxSuccess(function(_ev, xhr, settings) {
                    if (!settings || !settings.url) return;
                    if (settings.url.indexOf('ASAjax') === -1) return;
                    var res = (xhr.responseText || '').trim();
                    // Only hijack on a successful login response
                    if (res === 'true' || /\.php$/i.test(res)) {
                        // Overwrite whatever login.js set; runs synchronously after its handler.
                        window.location = next;
                    }
                });
            });
        })();

    <!-- UI Interaction Script -->
    <script>
        lucide.createIcons();

        $(document).ready(function() {
            
            // Switch to Forgot Password View
            $("#btn-toggle-forgot").on("click", function() {
                $("#login-pane").addClass("hidden-pane");
                $("#main-header").addClass("hidden-pane"); 
                $("#forgot-pane").removeClass("hidden-pane");
                $("#ajax-alert-container").empty();
            });

            // Switch back to Login View
            $("#btn-back-to-login").on("click", function() {
                $("#forgot-pane").addClass("hidden-pane");
                $("#login-pane").removeClass("hidden-pane");
                $("#main-header").removeClass("hidden-pane"); 
                $("#ajax-alert-container").empty();
            });

            // ============================================
            // AJAX INTERCEPTOR (FIXED FOR SUCCESS REDIRECT)
            // ============================================
            $(document).ajaxComplete(function(event, xhr, settings) {
                if (xhr.responseText) {
                    var response = xhr.responseText.trim();
                    
                    // We only want to show an error if:
                    // 1. It is NOT "success"
                    // 2. It is NOT "true"
                    // 3. It DOES NOT end with ".php" (which implies a redirect URL)
                    // 4. It looks like a short text message, not HTML or code
                    
                    var isSuccess = (response === "success" || response === "true" || response.endsWith(".php"));

                    if (!isSuccess && response.length < 200 && !response.includes("<!doctype")) {
                        var errorHtml = `
                            <div class="alert alert-danger flex items-center gap-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
                                <span>${response}</span>
                            </div>
                        `;
                        $("#ajax-alert-container").html(errorHtml);
                    }
                }
            });

            // Handle Register Success
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('register') === 'success') {
                var successHtml = `
                    <div class="alert alert-success flex items-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                        <div>
                            <strong class="font-bold block">申请提交成功！</strong>
                            <span>登录信息已发送到您的邮箱。</span>
                        </div>
                    </div>
                `;
                $("#ajax-alert-container").html(successHtml);
            }
        });
    </script>
